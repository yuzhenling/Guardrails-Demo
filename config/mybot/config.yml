# LLM model configuration
models:
  # Main application LLM
  - type: main
    engine: ollama
    model: llama3.2
    parameters:
      # ChatOllama uses Ollama's native HTTP API; do NOT append /v1 (that causes 404).
      base_url: http://localhost:11434

  - type: self_check_input
    engine: ollama
    model: granite3-guardian:8b
    parameters:
      base_url: http://localhost:11434

