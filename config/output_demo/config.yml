models:
  - type: main
    engine: ${MAIN_MODEL_ENGINE:-openai}
    model: ${MAIN_MODEL_NAME:-deepseek-chat}
    parameters:
      base_url: ${MAIN_MODEL_BASE_URL:-https://api.deepseek.com/v1}

instructions:
  - type: general
    content: |
      你是一个对人类有帮助的AI助手，请用中文回答问题。

rails:
  input: {}
  output:
    parallel: false
    flows:
      - self check output          # LLM-based output validation
      - check_output_terms
    ##      - content safety check output $model=content_safety
    ##      - self check facts           # Fact verification
    ##      - self check hallucination   # Hallucination detection
    ##      - mask sensitive data on output  # PII masking
    ##      - injection detection
    streaming:
      enabled: false
      chunk_size: 200
      context_size: 50
      stream_first: true

  dialog: {}

logging:
  level: INFO
